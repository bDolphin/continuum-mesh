<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #1a1a1a;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      background: #f5f5f5;
      margin-bottom: 12px;
    }
    
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }
    
    .status-indicator.online {
      background: #22c55e;
    }
    
    .status-indicator.offline {
      background: #ef4444;
    }
    
    .status-text {
      font-weight: 500;
      color: #4b5563;
    }
    
    .info {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    
    .button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .button:hover {
      background: #1d4ed8;
    }
    
    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    
    .link {
      display: block;
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #2563eb;
      text-decoration: none;
    }
    
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Context Mesh</h1>
  
  <div class="status">
    <div class="status-indicator" id="statusIndicator"></div>
    <div class="status-text" id="statusText">Checking daemon...</div>
  </div>
  
  <div class="info">
    Automatically capturing conversations from Perplexity and ChatGPT.
  </div>
  
  <button class="button" id="openDashboard">
    Open Dashboard
  </button>
  
  <a href="#" class="link" id="testConnection">Test Connection</a>
  
  <script src="popup.js"></script>
</body>
</html>
